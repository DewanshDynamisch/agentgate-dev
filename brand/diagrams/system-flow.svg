<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <title>AgentGate System Flow</title>
  <style>
    .box { fill: var(--ag-bg-surface, #ffffff); stroke: var(--ag-border, #e4e4e7); stroke-width: 2; }
    .text { fill: var(--ag-text-primary, #18181b); font-family: var(--ag-font-sans, sans-serif); font-size: 14px; text-anchor: middle; }
    .line { stroke: var(--ag-text-secondary, #71717a); stroke-width: 2; marker-end: url(#arrow); }
    .accent-box { fill: var(--ag-accent-soft, #e0e7ff); stroke: var(--ag-accent, #4338ca); stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ag-text-secondary, #71717a)" />
    </marker>
  </defs>

  <rect x="50" y="150" width="100" height="60" rx="8" class="box" />
  <text x="100" y="185" class="text">Agent</text>

  <line x1="150" y1="180" x2="250" y2="180" class="line" />

  <rect x="250" y="150" width="120" height="60" rx="8" class="box" />
  <text x="310" y="185" class="text">agentgateway</text>

  <line x1="370" y1="180" x2="450" y2="180" class="line" />

  <rect x="450" y="150" width="120" height="60" rx="8" class="accent-box" />
  <text x="510" y="185" class="text">AgentGate</text>

  <line x1="570" y1="180" x2="650" y2="180" class="line" />

  <rect x="650" y="150" width="100" height="60" rx="8" class="box" />
  <text x="700" y="185" class="text">Tool (Backend)</text>

  <!-- Keycloak -->
  <rect x="250" y="50" width="120" height="50" rx="8" class="box" />
  <text x="310" y="80" class="text">Keycloak</text>
  <line x1="310" y1="150" x2="310" y2="100" class="line" stroke-dasharray="4" />

  <!-- Postgres -->
  <rect x="450" y="270" width="120" height="50" rx="8" class="box" />
  <text x="510" y="300" class="text">Postgres (Audit)</text>
  <line x1="510" y1="210" x2="510" y2="270" class="line" />
</svg>
