<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <title>AgentGate Credential Flow</title>
  <style>
    .box { fill: var(--ag-bg-surface, #ffffff); stroke: var(--ag-border, #e4e4e7); stroke-width: 2; }
    .text { fill: var(--ag-text-primary, #18181b); font-family: var(--ag-font-sans, sans-serif); font-size: 14px; text-anchor: middle; }
    .line { stroke: var(--ag-text-secondary, #71717a); stroke-width: 2; marker-end: url(#arrow); }
    .accent { fill: var(--ag-accent-soft, #e0e7ff); stroke: var(--ag-accent, #4338ca); stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ag-text-secondary, #71717a)" />
    </marker>
  </defs>

  <rect x="50" y="150" width="120" height="60" rx="8" class="box" />
  <text x="110" y="175" class="text">Inbound Token</text>
  <text x="110" y="195" class="text">(Verified)</text>

  <line x1="170" y1="180" x2="270" y2="180" class="line" />

  <rect x="270" y="150" width="120" height="60" rx="8" class="accent" />
  <text x="330" y="175" class="text">AgentGate</text>
  <text x="330" y="195" class="text">(Mints Credential)</text>

  <line x1="390" y1="180" x2="490" y2="180" class="line" />

  <rect x="490" y="150" width="120" height="60" rx="8" class="box" />
  <text x="550" y="175" class="text">Scoped Credential</text>
  <text x="550" y="195" class="text">(Short-lived)</text>

  <line x1="610" y1="180" x2="710" y2="180" class="line" />

  <rect x="710" y="150" width="80" height="60" rx="8" class="box" />
  <text x="750" y="185" class="text">Backend</text>

  <!-- JWKS Verification -->
  <line x1="750" y1="150" x2="750" y2="100" class="line" stroke-dasharray="4" />
  <line x1="750" y1="100" x2="330" y2="100" class="line" stroke-dasharray="4" />
  <line x1="330" y1="100" x2="330" y2="150" class="line" stroke-dasharray="4" />
  <text x="540" y="90" class="text">JWKS Verification</text>
</svg>
