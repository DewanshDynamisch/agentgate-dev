<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <title>AgentGate Policy Lifecycle</title>
  <style>
    .box { fill: var(--ag-bg-surface, #ffffff); stroke: var(--ag-border, #e4e4e7); stroke-width: 2; }
    .text { fill: var(--ag-text-primary, #18181b); font-family: var(--ag-font-sans, sans-serif); font-size: 14px; text-anchor: middle; }
    .line { stroke: var(--ag-text-secondary, #71717a); stroke-width: 2; marker-end: url(#arrow); }
    .candidate { fill: var(--ag-candidate-soft, #fefce8); stroke: var(--ag-candidate, #a16207); stroke-width: 2; }
    .allow { fill: var(--ag-allow-soft, #f0fdf4); stroke: var(--ag-allow, #15803d); stroke-width: 2; }
    .deny { fill: var(--ag-deny-soft, #fef2f2); stroke: var(--ag-deny, #b91c1c); stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ag-text-secondary, #71717a)" />
    </marker>
  </defs>

  <rect x="50" y="150" width="100" height="60" rx="8" class="candidate" />
  <text x="100" y="185" class="text">Candidate</text>

  <line x1="150" y1="180" x2="250" y2="180" class="line" />

  <rect x="250" y="150" width="100" height="60" rx="8" class="box" />
  <text x="300" y="185" class="text">Dry-run</text>

  <line x1="350" y1="180" x2="450" y2="180" class="line" />

  <rect x="450" y="150" width="100" height="60" rx="8" class="allow" />
  <text x="500" y="185" class="text">Activate</text>

  <line x1="550" y1="180" x2="650" y2="180" class="line" />

  <rect x="650" y="150" width="100" height="60" rx="8" class="deny" />
  <text x="700" y="185" class="text">Rollback</text>
  
  <path d="M 700 210 L 700 250 L 500 250 L 500 210" class="line" fill="none" stroke-dasharray="4" />
</svg>
