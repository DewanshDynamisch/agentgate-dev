# deploy/demo/docker-compose.yml — G7 Task B Realistic Demonstration System
#
# Additive to deploy/g6/ — does not modify or replace it. Proves the exact
# same agentgateway -> AgentGate -> backend enforcement path G6 proved, but
# against a business-meaningful backend (support-desk-mcp: list/update/delete
# support tickets) instead of the toy call-counting probe, so a real policy
# change visibly changes real product behavior. See README.md for the walkthrough.
#
# SECURITY & CREDENTIAL HANDLING NOTE (mirrors deploy/g6/docker-compose.yml):
# every credential below is an explicit, non-secret development fixture. This
# topology is a demonstration/integration harness, not a production deployment.
# Production topologies must never embed or default credentials.

name: agentgate-demo

services:
  postgres:
    image: postgres:16-alpine
    container_name: demo-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-agentgate}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agentgate-dev-password}"
      POSTGRES_DB: "${POSTGRES_DB:-agentgate_demo_db}"
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentgate} -d ${POSTGRES_DB:-agentgate_demo_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - demonet

  agentgate:
    build:
      context: ../..
      dockerfile: deploy/g6/Dockerfile.agentgate
    image: agentgate/agentgate:g6
    container_name: demo-agentgate
    ports:
      - "8091:8090"
      - "9011:9001"
    environment:
      AGENTGATE_HTTP_ADDR: ":8090"
      AGENTGATE_AUTHZ_GRPC_ADDR: ":9001"
      AGENTGATE_ENV: "development"
      AGENTGATE_LOG_LEVEL: "debug"
      AGENTGATE_ADMIN_TOKEN: "${AGENTGATE_ADMIN_TOKEN:-agentgate-admin-secret-dev}"
      AGENTGATE_AUDIT_SALT: "${AGENTGATE_AUDIT_SALT:-audit-salt-demo-dev-fixture}"
      AGENTGATE_CREDENTIAL_AUDIENCES: "mcp-probe=support-desk,default=support-desk"
      AGENTGATE_CREDENTIAL_SIGNING_KEY_FILE: "/run/secrets/cred_key.pem"
      AGENTGATE_REQUIRE_DOWNSTREAM_CREDENTIAL: "true"
      AGENTGATE_TOOL_BOOTSTRAP_FILE: "/etc/agentgate/tools.bootstrap.json"
      AGENTGATE_DATABASE_URL: "${AGENTGATE_DATABASE_URL:-postgres://${POSTGRES_USER:-agentgate}:${POSTGRES_PASSWORD:-agentgate-dev-password}@postgres:5432/${POSTGRES_DB:-agentgate_demo_db}?sslmode=disable}"
    volumes:
      # Generated at runtime by run-demo-e2e.ps1; never committed.
      - ./secrets/cred_key.pem:/run/secrets/cred_key.pem:ro
      - ../shared/tools.bootstrap.json:/etc/agentgate/tools.bootstrap.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - demonet

  support-desk-mcp:
    build:
      context: ./support-desk-mcp
      dockerfile: Dockerfile
    image: agentgate/demo-support-desk-mcp:dev
    container_name: demo-support-desk-mcp
    # No host port: the backend is reachable only through the gateway.
    environment:
      DEMO_MCP_PORT: "9200"
      DEMO_MCP_JWKS_URL: "http://agentgate:8090/.well-known/jwks.json"
      DEMO_MCP_REQUIRE_CREDENTIAL: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9200/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - demonet

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.4.0@sha256:771afaf093065477fa296eb90dcb618a0300165f12a32f80bbdd1427fab900ec
    container_name: demo-agentgateway
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      - ./agentgateway.yaml:/etc/agentgateway/config.yaml:ro
      # Same dev-fixture JWT signing key as deploy/g6 (deploy/g6/jwks/README.md) —
      # copied, not referenced across directories, so deploy/demo stays fully
      # self-contained and portable on its own.
      - ./jwks:/jwks:ro
    ports:
      - "3001:3000"
    depends_on:
      agentgate:
        condition: service_healthy
      support-desk-mcp:
        condition: service_healthy
    networks:
      - demonet

networks:
  demonet:
    name: demonet
    driver: bridge

volumes:
  demo_pgdata:
