# deploy/g6/docker-compose.yml — G6 Real MCP Enforcement Topology
#
# SECURITY & CREDENTIAL HANDLING NOTE:
# This topology is an integration test harness for local and CI validation.
# Sensitive values (AGENTGATE_ADMIN_TOKEN, AGENTGATE_DATABASE_URL, POSTGRES_PASSWORD)
# are injected from caller environment variables when set, with explicit non-secret
# development fallback fixtures for isolated local runs.
# G6 local integration fixture != production secret configuration.
# Production topologies must NEVER embed or default credentials and must inject secrets
# via dedicated secret managers or orchestrator secret stores.

name: agentgate-g6

services:
  postgres:
    image: postgres:16-alpine
    container_name: g6-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-agentgate}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agentgate-dev-password}"
      POSTGRES_DB: "${POSTGRES_DB:-agentgate_db}"
    volumes:
      - g6_pgdata:/var/lib/postgresql/data
      - ./init-g6-db.sql:/docker-entrypoint-initdb.d/01-init-g6-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentgate} -d ${POSTGRES_DB:-agentgate_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - g6net

  agentgate:
    build:
      context: ../..
      dockerfile: deploy/g6/Dockerfile.agentgate
    image: agentgate/agentgate:g6
    container_name: g6-agentgate
    ports:
      - "8090:8090"
      - "9001:9001"
    environment:
      AGENTGATE_HTTP_ADDR: ":8090"
      AGENTGATE_AUTHZ_GRPC_ADDR: ":9001"
      AGENTGATE_ENV: "development"
      AGENTGATE_LOG_LEVEL: "debug"
      AGENTGATE_ADMIN_TOKEN: "${AGENTGATE_ADMIN_TOKEN:-agentgate-admin-secret-dev}"
      AGENTGATE_AUDIT_SALT: "${AGENTGATE_AUDIT_SALT:-audit-salt-g6-dev-fixture}"
      # G6 backend (probe-mcp) does not verify credentials; no signing key here.
      AGENTGATE_CREDENTIAL_AUDIENCES: "mcp-probe=probe"
      AGENTGATE_REQUIRE_DOWNSTREAM_CREDENTIAL: "false"
      AGENTGATE_TOOL_BOOTSTRAP_FILE: "/etc/agentgate/tools.bootstrap.json"
      AGENTGATE_DATABASE_URL: "${AGENTGATE_DATABASE_URL:-postgres://${POSTGRES_USER:-agentgate}:${POSTGRES_PASSWORD:-agentgate-dev-password}@postgres:5432/${POSTGRES_DB:-agentgate_db}?sslmode=disable}"
    volumes:
      - ../shared/tools.bootstrap.json:/etc/agentgate/tools.bootstrap.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - g6net

  probe-mcp:
    build:
      context: ./probe-mcp
      dockerfile: Dockerfile
    image: agentgate/g6-probe-mcp:dev
    container_name: g6-probe-mcp
    ports:
      - "9100:9100"
      - "9101:9101"
    environment:
      G6_MCP_PORT: "9100"
      G6_COUNT_PORT: "9101"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9101/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - g6net

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.4.0@sha256:771afaf093065477fa296eb90dcb618a0300165f12a32f80bbdd1427fab900ec
    container_name: g6-agentgateway
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      - ./agentgateway.yaml:/etc/agentgateway/config.yaml:ro
      # jwtAuth.jwks.file in agentgateway.yaml is "./jwks/dev-fixture-jwks.json" —
      # verified empirically that agentgateway resolves this relative to its
      # process cwd ("/"), not relative to the config file's own directory, so
      # this mounts at the matching absolute path (G7 Task A finding).
      - ./jwks:/jwks:ro
    ports:
      - "3000:3000"
    depends_on:
      agentgate:
        condition: service_healthy
      probe-mcp:
        condition: service_healthy
    networks:
      - g6net

  probe-authz:
    build:
      context: ./probe-authz
      dockerfile: Dockerfile
    image: agentgate/g6-probe-authz:dev
    container_name: g6-probe-authz
    profiles: ["probe-only"]
    ports:
      - "9002:9002"
    environment:
      G6_AUTHZ_MODE: "allow"
      G6_AUTHZ_GRPC_PORT: "9001"
      G6_AUTHZ_HTTP_PORT: "9002"
    networks:
      - g6net

networks:
  g6net:
    name: g6net
    driver: bridge

volumes:
  g6_pgdata:
