name: CI

# Single CI workflow for the AgentGate repository.
#
# Covers:
# - Go validation (gofmt, vet, test -race, golangci-lint, govulncheck)
# - Demo module Go unit tests (support-desk-mcp, demo-agent)
# - Frontend contract & Admin UI application (typecheck, tests, lint)
# - Docker image builds (Dockerfile.agentgate, Dockerfile.admin-ui,
#   Dockerfile.support-desk-mcp, Dockerfile.demo-agent - no push)
# - G6 live enforcement E2E
# - Demo live enforcement E2E
# - V1 production live security gate suite

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentgate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Go module
        id: gomod
        shell: bash
        run: |
          if [ -f go.mod ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No agentgate/go.mod present. Go validation steps are skipped (see docs/DEVELOPMENT/CI_BASELINE.md)."
          fi

      - name: Set up Go
        if: steps.gomod.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: agentgate/go.mod
          check-latest: true

      - name: Check formatting (gofmt)
        if: steps.gomod.outputs.exists == 'true'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        if: steps.gomod.outputs.exists == 'true'
        run: go vet ./...

      - name: go test (race-enabled)
        if: steps.gomod.outputs.exists == 'true'
        run: go test -race ./...

      - name: golangci-lint
        if: steps.gomod.outputs.exists == 'true'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          args: --timeout=5m
          only-new-issues: true
          working-directory: agentgate

      - name: govulncheck
        if: steps.gomod.outputs.exists == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  demo-module-tests:
    name: Demo module tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agentgate/go.mod
          check-latest: true

      - name: Test support-desk-mcp (race-enabled)
        working-directory: deploy/demo/support-desk-mcp
        run: go test -race ./...

      - name: Test demo-agent (race-enabled)
        working-directory: deploy/prod/demo-agent
        run: go test -race ./...

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend packages
        id: pkgs
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "frontend_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f frontend/app/package.json ]; then
            echo "app_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/app/package-lock.json

      # frontend/ (contract layer)
      - name: Install dependencies (frontend)
        if: steps.pkgs.outputs.frontend_exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck (frontend)
        if: steps.pkgs.outputs.frontend_exists == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Vitest tests (frontend)
        if: steps.pkgs.outputs.frontend_exists == 'true'
        working-directory: frontend
        run: npm test

      # frontend/app (Admin UI SPA)
      - name: Install dependencies (frontend/app)
        if: steps.pkgs.outputs.app_exists == 'true'
        working-directory: frontend/app
        run: npm ci

      - name: Build (frontend/app)
        if: steps.pkgs.outputs.app_exists == 'true'
        working-directory: frontend/app
        run: npm run build

      - name: Vitest tests (frontend/app)
        if: steps.pkgs.outputs.app_exists == 'true'
        working-directory: frontend/app
        run: npm test

      - name: Lint (frontend/app)
        if: steps.pkgs.outputs.app_exists == 'true'
        working-directory: frontend/app
        run: npm run lint

  images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build agentgate image
        run: docker build -f deploy/docker/Dockerfile.agentgate -t agentgate:test .

      - name: Build admin-ui image
        run: docker build -f deploy/docker/Dockerfile.admin-ui -t admin-ui:test .

      - name: Build support-desk-mcp image
        run: docker build -f deploy/docker/Dockerfile.support-desk-mcp -t support-desk-mcp:test .

      - name: Build demo-agent image
        run: docker build -f deploy/docker/Dockerfile.demo-agent -t demo-agent:test .

  g6-live-e2e:
    name: G6 live enforcement E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the G6 live enforcement matrix
        shell: pwsh
        run: ./run-e2e-matrix.ps1
        working-directory: deploy/g6

      - name: Dump container logs on failure
        if: failure()
        shell: bash
        working-directory: deploy/g6
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        shell: bash
        working-directory: deploy/g6
        run: docker compose down -v

  demo-live-e2e:
    name: Demo live enforcement E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run demo live E2E
        shell: pwsh
        run: ./run-demo-e2e.ps1
        working-directory: deploy/demo

      - name: Dump container logs on failure
        if: failure()
        shell: bash
        working-directory: deploy/demo
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        shell: bash
        working-directory: deploy/demo
        run: docker compose down -v

  v1-security-gate:
    name: V1 production security gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Run V1 security gate
        shell: pwsh
        run: ./deploy/prod/scripts/run-security-gate.ps1

      - name: Dump container logs on failure
        if: failure()
        shell: bash
        run: docker compose -f deploy/prod/docker-compose.yml logs --tail=300

      - name: Tear down
        if: always()
        shell: bash
        run: docker compose -f deploy/prod/docker-compose.yml down -v

  website:
    name: Website validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build
        working-directory: website
        run: npm run build
      - name: Typecheck
        working-directory: website
        run: npm run typecheck
      - name: Test
        working-directory: website
        run: npm test
      - name: Check offline
        working-directory: website
        run: npm run check:offline
      - name: Check landing
        working-directory: website
        run: npm run check-landing
      - name: Tools tests
        run: node --test tools/test/*.test.mjs
      - name: Brand tokens parity check
        run: node tools/check-brand-tokens.mjs --files brand/tokens.css frontend/app/src/styles/tokens.css website/src/css/tokens.css
      - name: SVG hygiene check
        run: node tools/check-svg.mjs brand

  docs-quickstart:
    name: Docs Quickstart Verifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run quickstart verifier
        run: node website/scripts/verify-quickstart.mjs --file website/docs/quickstart.md --with-stack
